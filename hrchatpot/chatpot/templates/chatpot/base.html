<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}HR Assistant Chatbot{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            background-color: #f0f2f5;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background-color: #ffffff;
            padding: 20px;
            height: 100vh;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar a {
            display: block;
            margin: 10px 0;
            padding: 12px;
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            border: none;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .sidebar a:hover {
            background-color: #45a049;
        }

        .main-content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .logout-form {
            position: absolute;
            right: 30px;
        }

        .logout-form button {
            background-color: #ffffff;
            color: #4CAF50;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .logout-form button:hover {
            background-color: #e7e7e7;
        }

        .main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="{% url 'dashboard' %}">Home</a>
        {% if request.user.role == 'HR' %}
            <a href="{% url 'upload_zip' %}">Upload New Policies</a>
        {% endif %}
        <a href="{% url 'index' %}">Ask</a>
    </div>

    <div class="main-content-wrapper">
        <div class="header">
            AI driven HR Assistant Chatbot
            <form class="logout-form" method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        </div>
        <div class="main-content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</body>
</html>
